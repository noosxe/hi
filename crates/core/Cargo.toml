[package]
name = "hi-core"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Image decode/resize/encode for `read`'s attachments (AD-0009): the four
# wire formats only, everything else trimmed.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
] }
flate2 = "1"
ureq = { version = "3", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
globset = "0.4"
ignore = "0.4.33"

# Process-group kill for the background task manager (#5, AD-0019).
# Already in the tree transitively (getrandom/rustls) — zero new crates.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
