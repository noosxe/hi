[package]
name = "hi-tui"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
base64 = "0.22"
hi-core = { path = "../core" }
pulldown-cmark = "0.13.4"
serde_json = "1"
# ratatui re-exports its crossterm dependency, so one dep covers both.
ratatui = { version = "0.30" }
unicode-width = "0.2"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
# Process-group liveness assertions in the task-note tests (#5).
[dev-dependencies]
libc = "0.2"
