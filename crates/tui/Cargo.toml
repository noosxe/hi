[package]
name = "hi-tui"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
base64 = "0.22"
hi-core = { path = "../core" }
pulldown-cmark = "0.13.4"
serde_json = "1"
# ratatui re-exports its crossterm dependency, so one dep covers both
# scrolling-regions: insert_before scrolls with CSI r instead of
# redrawing the whole screen per flush — the efficient inline-viewport
# path (discovered by the pty harness, see crates/cli/tests/tui_pty.rs).
ratatui = { version = "0.30", features = ["scrolling-regions"] }
unicode-width = "0.2"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
